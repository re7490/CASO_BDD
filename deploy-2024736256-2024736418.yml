services:
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    restart: always
    command: ["mongod", "--replSet", "my-replica-set", "--bind_ip_all", "--port", "30001"]
    ports:
      - "30001:30001"
    volumes:
      - mongo1_data:/data/db
    networks:
      mongo-net:
        aliases:
          - mongo1

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    restart: always
    command: ["mongod", "--replSet", "my-replica-set", "--bind_ip_all", "--port", "30002"]
    ports:
      - "30002:30002"
    volumes:
      - mongo2_data:/data/db
    networks:
      mongo-net:
        aliases:
          - mongo2

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    restart: always
    command: ["mongod", "--replSet", "my-replica-set", "--bind_ip_all", "--port", "30003"]
    ports:
      - "30003:30003"
    volumes:
      - mongo3_data:/data/db
    networks:
      mongo-net:
        aliases:
          - mongo3

networks:
  mongo-net:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data: